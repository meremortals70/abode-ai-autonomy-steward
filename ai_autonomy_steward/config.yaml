name: "AI Autonomy Steward"
version: "0.1.0"
slug: "ai_autonomy_steward"
description: "A Home Assistant App that continuously reasons about your home's current state, proposes actions for one-time approval, then acts autonomously - bounded by an append-only constraint layer that only ever grows stricter."
url: "https://github.com/meremortals70/ha-ai-autonomy-steward"
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
startup: services
boot: auto
map:
  - type: data
    read_only: false
options:
  notify_service: "notify.mobile_app_YOUR_DEVICE"
  min_confidence: 0.70
  cycle_delay_seconds: 15
schema:
  notify_service: str
  min_confidence: "float(0,1)"
  cycle_delay_seconds: "int(1,)"

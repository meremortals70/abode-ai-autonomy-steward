<svg viewBox="0 0 1180 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1180" height="700" fill="#ffffff"/>

  <!-- STEWARD, Level 2, near the top -->
  <rect x="475" y="40" width="240" height="90" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="595" y="72" font-size="16" font-weight="700" text-anchor="middle" fill="#4c1d95">STEWARD (Level 2)</text>
  <text x="595" y="92" font-size="12" text-anchor="middle" fill="#4c1d95">domain-agnostic once woken -</text>
  <text x="595" y="108" font-size="12" text-anchor="middle" fill="#4c1d95">synthesises across all domains</text>

  <!-- arrow up from Vigil bus to Steward -->
  <path d="M 595 220 L 595 132" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="770" y="180" font-size="12" font-style="italic" fill="#64748b">any domain escalating wakes Steward</text>

  <!-- Vigil boundary, Level 1, below Steward -->
  <rect x="40" y="220" width="1100" height="440" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="64" y="252" font-size="16" font-weight="700" fill="#78350f" letter-spacing="1">VIGIL (Level 1)</text>
  <text x="64" y="272" font-size="12" fill="#92400e">six independent domain functions, same rank as each other - none depends on another to run</text>

  <!-- Vigil bus / access controller -->
  <rect x="70" y="290" width="1050" height="56" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="595" y="312" font-size="13" font-weight="700" text-anchor="middle" fill="#312e81">VIGIL BUS / ACCESS CONTROLLER — deterministic, not a judgment layer</text>
  <text x="595" y="330" font-size="10.5" text-anchor="middle" fill="#3730a3">arbitrates shared AI Engine access across domains, QCI-style priority classes - positioned, NOT designed. Blocked on real per-domain call cost/frequency.</text>

  <!-- Six domain boxes, parallel, same rank, below the bus -->
  <g>
    <rect x="70" y="380" width="160" height="130" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
    <text x="150" y="408" font-size="13" font-weight="700" text-anchor="middle" fill="#78350f">SAFETY</text>
    <text x="150" y="430" font-size="10.5" text-anchor="middle" fill="#92400e">fire, gas, leak,</text>
    <text x="150" y="445" font-size="10.5" text-anchor="middle" fill="#92400e">falls, structural</text>
    <text x="150" y="470" font-size="10" font-style="italic" text-anchor="middle" fill="#b45309">likely: cheapest,</text>
    <text x="150" y="484" font-size="10" font-style="italic" text-anchor="middle" fill="#b45309">fastest, highest</text>
    <text x="150" y="498" font-size="10" font-style="italic" text-anchor="middle" fill="#b45309">priority</text>
  </g>

  <g>
    <rect x="250" y="380" width="160" height="130" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
    <text x="330" y="408" font-size="13" font-weight="700" text-anchor="middle" fill="#78350f">SECURITY</text>
    <text x="330" y="430" font-size="10.5" text-anchor="middle" fill="#92400e">intrusion, unrecognized</text>
    <text x="330" y="445" font-size="10.5" text-anchor="middle" fill="#92400e">presence, unsecured entries</text>
  </g>

  <g>
    <rect x="430" y="380" width="160" height="130" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
    <text x="510" y="408" font-size="13" font-weight="700" text-anchor="middle" fill="#78350f">COMFORT</text>
    <text x="510" y="430" font-size="10.5" text-anchor="middle" fill="#92400e">temperature, air</text>
    <text x="510" y="445" font-size="10.5" text-anchor="middle" fill="#92400e">quality, light, noise</text>
  </g>

  <g>
    <rect x="610" y="380" width="180" height="130" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
    <text x="700" y="408" font-size="13" font-weight="700" text-anchor="middle" fill="#78350f">PATTERN DEVIATION</text>
    <text x="700" y="430" font-size="10.5" text-anchor="middle" fill="#92400e">resident or device</text>
    <text x="700" y="445" font-size="10.5" text-anchor="middle" fill="#92400e">deviating from baseline</text>
    <text x="700" y="470" font-size="10" font-style="italic" text-anchor="middle" fill="#b45309">likely: needs more</text>
    <text x="700" y="484" font-size="10" font-style="italic" text-anchor="middle" fill="#b45309">context per call -</text>
    <text x="700" y="498" font-size="10" font-style="italic" text-anchor="middle" fill="#b45309">comparing against history</text>
  </g>

  <g>
    <rect x="810" y="380" width="170" height="130" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
    <text x="895" y="408" font-size="13" font-weight="700" text-anchor="middle" fill="#78350f">RESOURCE STEWARDSHIP</text>
    <text x="895" y="430" font-size="10.5" text-anchor="middle" fill="#92400e">energy/water waste,</text>
    <text x="895" y="445" font-size="10.5" text-anchor="middle" fill="#92400e">cost</text>
  </g>

  <g>
    <rect x="1000" y="380" width="120" height="130" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="1060" y="408" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">HOUSEHOLD</text>
    <text x="1060" y="424" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">OPERATIONS</text>
    <text x="1060" y="448" font-size="10" text-anchor="middle" fill="#7f1d1d">anticipating</text>
    <text x="1060" y="462" font-size="10" text-anchor="middle" fill="#7f1d1d">routine needs</text>
    <text x="1060" y="486" font-size="9.5" font-style="italic" text-anchor="middle" fill="#dc2626">watch: most at risk</text>
    <text x="1060" y="498" font-size="9.5" font-style="italic" text-anchor="middle" fill="#dc2626">of being Reflex</text>
    <text x="1060" y="510" font-size="9.5" font-style="italic" text-anchor="middle" fill="#dc2626">in disguise</text>
  </g>

  <!-- arrows from each domain box up into the bus -->
  <path d="M 150 378 L 150 348" stroke="#4338ca" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 330 378 L 330 348" stroke="#4338ca" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 510 378 L 510 348" stroke="#4338ca" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 700 378 L 700 348" stroke="#4338ca" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 895 378 L 895 348" stroke="#4338ca" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1060 378 L 1060 348" stroke="#4338ca" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Note: below the domains, Senses feeds them (Level 0 -> Level 1) -->
  <text x="595" y="545" font-size="12" font-style="italic" text-anchor="middle" fill="#64748b">each domain function evaluates events from Senses (Level 0, below) - not drawn here, see the full-stack diagram</text>

  <!-- ZenOS-AI precedent note -->
  <rect x="70" y="565" width="1050" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="595" y="588" font-size="11" text-anchor="middle" fill="#78350f">ZenOS-AI precedent (read from source): priority-based load-shedding under queue pressure,</text>
  <text x="595" y="606" font-size="11" text-anchor="middle" fill="#78350f">a fast-path tier that bypasses delay entirely for the highest-priority class - shape to design against, once domain call costs are real</text>

</svg>
